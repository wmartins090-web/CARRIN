name: lista_compras
description: Ecossistema mobile inteligente para compras de mercado, controle de orçamento e radar colaborativo de preços integrado ao Google Sheets.
version: 1.3.596+596

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  package_info_plus: ^9.0.1
  gsheets: ^0.5.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.9.0
  intl: ^0.20.2
  share_plus: ^10.1.4
  fl_chart: ^1.2.0
  flutter_staggered_animations: ^1.1.1
  visibility_detector: ^0.4.0+2
  reorderable_grid_view: ^2.2.8
  pdf: ^3.12.0
  printing: ^5.14.3
  html: ^0.15.4
  path_provider: ^2.1.5
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  mobile_scanner: ^5.1.1
  vibration: ^3.1.8
  flutter_typeahead: ^6.0.0
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  google_sign_in: ^6.2.1
  googleapis: ^11.4.0
  http: ^1.6.0
  wakelock_plus: ^1.5.2
  geolocator: ^13.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  workmanager: ^0.10.10
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A1C2C"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  adaptive_icon_foreground_scale: 1.0 
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/credentials.json

